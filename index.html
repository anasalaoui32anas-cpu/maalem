function navItems(){
  const role = S.profile.role, tabs = TABS[role] || TABS.customer;
  const tabItem = (k, l, icn) => ({ k, label: l, icon: icn, active: S.tab === k, go: () => { S.tab = k; window.scrollTo(0,0); } });
  const items = tabs.map(([k, l, icn]) => tabItem(k, l, icn));
  const sheet = (k, label, icon, sh) => ({ k, label, icon, go: () => openSheet(sh) });
  const extra = {
    customer: [tabItem("mechs","الحرفيون","people")],
    mechanic: [tabItem("offers","عروضي","tag"), tabItem("stats","إحصائياتي","chart"), sheet("wallet","رصيدي","wallet",{type:"wallet"})],
    admin: [tabItem("home","الحائط","feed"), tabItem("inbox","الرسائل","chat")],
    regionAdmin: [tabItem("home","الحائط","feed"), tabItem("inbox","الرسائل","chat")]
  }[role] || [];
  return [...items, ...extra, sheet("groups","المجموعات","groups",{type:"groups"}), sheet("myprof","ملفي العام","user",{type:"profile", id:S.user.uid})];
}
function badgesFor(){
  const role = S.profile.role, b = {};
  if (role === "customer"){ const n = (S.myReqs||[]).reduce((a,r)=>a+unseenOffers(r),0); if(n) b.reqs = n; }
  if (role === "mechanic"){
    const n = (S.jobs||[]).filter(r=>r.status==="accepted").length; if(n) b.jobs = n;
    const seen = S.lastSeenOpen || ls.get("lastSeenOpen", 0), tr = mTrades(S.mech);
    const fresh = S.tab === "open" ? 0 : (S.openReqs||[]).filter(r => r.createdAt > seen && tr.includes(reqTrade(r))).length; if (fresh) b.open = fresh;
  }
  if (isAdminLike()){
    const n = (S.allMechs||[]).filter(m=>m.status==="pending").length; if(n) b.amechs = n;
    const t = (S.allTopups||[]).filter(x=>x.status==="pending").length, rp = (S.reports||[]).filter(x=>x.status==="open").length;
    if (role === "admin" && (t || rp)) b.afin = t + rp;
    if (role === "regionAdmin"){ if (t) b.atop = t; if (rp) b.arep = rp; }
  }
  const dm = dmUnread(); if (dm) b.inbox = dm;
  return b;
}
// محتوى القائمة: مشترك بين الدرج (الهاتف) والشريط الجانبي (الشاشات الكبيرة)
function sideMenu(inDrawer){
  const p = S.profile, badges = badgesFor();
  const pick = it => { if (inDrawer) closeDrawer(); it.go(); rerender(); };

  const item = it => h("button",{type:"button",class:"side-item" + (it.active ? " on" : ""),"aria-current": it.active ? "page" : null,onclick:()=>pick(it)},
    ic(it.icon, 20), h("span",null,it.label), badges[it.k] ? h("span",{class:"badge-in"}, badges[it.k]) : null);
  return h("div",{class:"side-in"},
    h("div",{class:"side-top"}, logo(36, true),
      inDrawer ? h("button",{class:"icon-btn",type:"button","aria-label":"إغلاق القائمة",svg:I.close,onclick:closeDrawer}) : null),
    h("div",{class:"side-user"},
      h("span",{class:"avatar"}, (p.name || "؟").trim().charAt(0)),
      h("div",{style:"min-width:0"}, h("strong",{class:"ell",style:"display:block"}, p.name),
        h("span",{class:"small muted"}, ROLE_AR[p.role] + (p.role === "regionAdmin" ? " · " + regionName(p.region) : " · " + cityName(p.city))))),

    h("nav",{class:"side-nav","aria-label":"معلومات"},
      item({ k:"notifs", label:"الإشعارات", icon:"bell", go: () => openSheet({type:"notifs"}) }),
      item({ k:"about", label:"كيف يعمل التطبيق", icon:"info", go: () => openSheet({type:"about"}) }),
      item({ k:"pricing", label:"الأسعار", icon:"tag", go: () => openSheet({type:"pricing"}) }),
      item({ k:"terms", label:"الشروط والخصوصية", icon:"doc", go: () => openSheet({type:"terms"}) }),
      S.installEvt ? item({ k:"install", label:"تثبيت التطبيق", icon:"download", go: async () => { const e = S.installEvt; S.installEvt = null; e.prompt(); } }) : null,
      item({ k:"logout", label:"تسجيل الخروج", icon:"logout", go: () => signOut(auth) })),
    h("div",{class:"side-foot small muted"}, "© " + new Date().getFullYear() + " " + APP_NAME));
}
function openDrawer(){
  const root = $("#drawer-root");
  const panel = h("aside",{class:"drawer",role:"dialog","aria-modal":"true","aria-label":"القائمة"}, sideMenu(true));
  root.replaceChildren(h("div",{class:"scrim",onclick:closeDrawer}), panel);
  root.classList.add("open"); document.body.style.overflow = "hidden";
  requestAnimationFrame(() => root.classList.add("in"));
  const first = panel.querySelector(".side-item"); if (first) first.focus();
}
function closeDrawer(){
  const root = $("#drawer-root"); if (!root.classList.contains("open")) return;
  root.classList.remove("in", "open"); root.replaceChildren(); if (!S.sheet) document.body.style.overflow = "";
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

function siteFooter(){

  return h("footer",{class:"site-foot"},

}
